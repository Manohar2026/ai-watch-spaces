# Local stack: application + PostgreSQL 17 (SYSTEM_DESIGN §11). Credentials come from .env.
# The image tag is the same one Testcontainers uses (OD-4); see docs/dependency-versions.md.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${DB_NAME:-aiws}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-aiws}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      INVITE_CODE_PEPPER: ${INVITE_CODE_PEPPER:?set INVITE_CODE_PEPPER (>=32 UTF-8 bytes) in .env}
      JWT_ISSUER: ${JWT_ISSUER:-ai-watch-spaces}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      AIWS_ASSETS_DIRECTORY: /var/lib/aiws/assets
      AIWS_SEED_CONTENT_ENABLED: ${AIWS_SEED_CONTENT_ENABLED:-false}
      AIWS_SEED_CONTENT_UPLOADED_BY: ${AIWS_SEED_CONTENT_UPLOADED_BY:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - assets:/var/lib/aiws/assets

volumes:
  pgdata:
  assets:
