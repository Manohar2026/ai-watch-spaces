# Integration-test profile. The datasource comes from Testcontainers via @ServiceConnection.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    # Only the application's migrations. The M1 JSONB probe migration runs separately in its own
    # schema and history table (M1ProbeSchemaConfiguration).
    locations: classpath:db/migration

aiws:
  auth:
    # Test-only key (base64 of a 35-byte ASCII string). Not a secret; never used outside tests.
    jwt-signing-key: dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS0zMi1ieXRlcyE=
    issuer: ai-watch-spaces-test
  rate-limits:
    # Generous so ordinary tests are not throttled; RateLimitIT uses the real defaults.
    auth:
      login-per-email: { limit: 1000, window: 1m }
      login-per-ip: { limit: 1000, window: 1m }
      register-per-ip: { limit: 1000, window: 1m }
