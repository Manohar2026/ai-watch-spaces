name: Frontend CI

on:
  pull_request:
    branches: [main, feature/m4-watchspace-lifecycle, feature/m5-realtime-foundation, feature/m3-catalog-timeline]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [feature/full-stack-architecture, feature/catalog-ui, feature/m4-watchspace-lifecycle, feature/m5-realtime-foundation]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Preserve generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1
