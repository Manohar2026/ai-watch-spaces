name: Deployment image

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "src/main/**"
      - "frontend/**"
      - ".github/workflows/deployment-image.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "src/main/**"
      - "frontend/**"
      - ".github/workflows/deployment-image.yml"

permissions:
  contents: read

jobs:
  docker-build:
    name: Build production Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag ai-watch-spaces:ci .
